<!DOCTYPE html>
<html lang="en">
<head>
<script src="playgama-bridge.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Alchemist vs Slimes</title>
<link rel="preload" as="image" href="assets/ui/btn-q-hi.png">
<link rel="preload" as="image" href="assets/ui/btn-s-hi.png">
<link rel="preload" as="image" href="assets/ui/btn-s-on.png">
<style>
  /* Alumni Sans (SIL Open Font License), Cyrillic and Latin subsets bundled with the game: no external font requests */
  @font-face { font-family: 'Alumni Sans'; font-style: normal; font-weight: 100 900; font-display: swap;
    src: url(assets/fonts/alumni-sans-cyrillic.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'Alumni Sans'; font-style: normal; font-weight: 100 900; font-display: swap;
    src: url(assets/fonts/alumni-sans-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  /* Shantell Sans (SIL Open Font License), also bundled */
  @font-face { font-family: 'Shantell Sans'; font-style: normal; font-weight: 400 800; font-display: swap;
    src: url(assets/fonts/shantell-sans-cyrillic.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'Shantell Sans'; font-style: normal; font-weight: 400 800; font-display: swap;
    src: url(assets/fonts/shantell-sans-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  /* The game font. To go back to Alumni Sans, swap the two blocks: or open the page with ?font=alumni to compare.
     --fs scales every text size (the faces differ in width), --cfs does the same for the text drawn on the canvas. */
  :root { --font: "Shantell Sans"; --fs: 1; --cfs: 1; }
  :root[data-font="alumni"] { --font: "Alumni Sans"; --fs: 1.4; --cfs: 1.3; }
  :root { --bg: #17122b; --panel: #251c45; --line: #4a3a80; --text: #f3ecff; --dim: #b3a6d9; --accent: #ffc94d; --accent-ink: #2b1c00; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: var(--font), system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; overscroll-behavior: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px;
    background: rgba(12, 8, 26, .78); z-index: 10; }
  .overlay.show { display: flex; }
  .panel { width: min(360px, 100%); max-height: 100%; overflow: auto; touch-action: pan-y; background: var(--panel); border: 2px solid var(--line);
    border-radius: 18px; padding: 20px; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  .art { display: block; height: 110px; margin: -6px auto 6px; pointer-events: none; -webkit-user-drag: none; }
  @media (max-height: 520px) { .art { display: none; } }
  h1 { margin: 0 0 2px; font-size: calc(26px * var(--fs)); line-height: 1.15; }
  h2 { margin: 0 0 12px; font-size: calc(22px * var(--fs)); }
  p { margin: 6px 0; color: var(--dim); font-size: calc(14px * var(--fs)); line-height: 1.3; }
  .big { font-size: calc(30px * var(--fs)); font-weight: 800; color: var(--accent); margin: 4px 0 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 12px 0; }
  .row > span { color: var(--dim); font-size: calc(14px * var(--fs)); }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper b { min-width: 34px; font-size: calc(20px * var(--fs)); }
  .row.col { flex-direction: column; align-items: stretch; text-align: left; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; }
  button { font: inherit; color: var(--text); background: #33275e; border: 2px solid var(--line); border-radius: 12px;
    padding: 9px 12px; cursor: pointer; font-weight: 700; touch-action: manipulation; }
  button:active { transform: translateY(1px); }
  button.on { background: #5a3fb0; border-color: #a78bfa; }
  button.primary { display: block; width: 100%; margin-top: 10px; padding: 14px; font-size: 18px;
    background: var(--accent); border-color: #ffe09a; color: var(--accent-ink); }
  button.wide { display: block; width: 100%; margin-top: 10px; padding: 12px; }
  button[disabled] { opacity: .4; cursor: default; }
  .rec { color: var(--accent); font-weight: 800; font-size: calc(16px * var(--fs)); margin: -6px 0 10px; }
  #lbList { list-style: none; margin: 10px 0; padding: 0; max-height: 46vh; overflow: auto; text-align: left; touch-action: pan-y; }
  #lbList li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; font-size: calc(15px * var(--fs)); }
  #lbList li:nth-child(odd) { background: rgba(255,255,255,.05); }
  #lbList li.me { background: #5a3fb0; outline: 2px solid #a78bfa; }
  #lbList .rk { width: 28px; text-align: right; color: var(--dim); font-weight: 700; flex: none; }
  #lbList li.me .rk { color: var(--text); }
  #lbList .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lbList b { color: var(--accent); flex: none; }
  /* main menu: the panel is a parchment scroll (9-slice: rollers top and bottom stretch with the content) */
  #ovMenu .panel { --text: #3a2208; --dim: #6a4623; width: min(400px, 100%); color: var(--text); background: none; box-shadow: none;
    border: solid transparent; border-width: 60px 34px 62px 34px; padding: 0 6px;
    border-image: url(assets/scroll.png) 118 96 118 96 fill / 59px 48px 59px 48px stretch; }
  @media (max-height: 520px) {      /* phone in landscape: smaller scroll, fewer words, so Play stays on screen */
    #ovMenu .panel { border-width: 40px 24px 42px 24px; border-image-width: 41px 34px 41px 34px; padding: 0 4px; }
    #ovMenu .panel h1 { font-size: calc(22px * var(--fs)); }
    #ovMenu .panel [data-t="tagline"], #ovMenu #howto { display: none; }
    #ovMenu .row { margin: 6px 0; }
    #ovMenu .panel p { margin: 4px 0; }
  }
  /* painted buttons: 9-slice sprites from assets/ui, text sits on top */
  button.primary, button.wide, .seg button, .sq { background: none; border: solid transparent; border-image-repeat: stretch; }
  button.primary { border-width: 18px; border-image: url(assets/ui/btn-primary.png) 40 fill / 18px stretch;
    color: #3a1a00; padding: 0 6px; margin-top: 8px; font-size: calc(18px * var(--fs)); }
  button.wide { border-width: 17px; border-image: url(assets/ui/btn-wide.png) 34 fill / 17px stretch;
    color: #f3ecff; padding: 0 6px; margin-top: 6px; font-size: calc(16px * var(--fs)); }
  .seg button { border-width: 13px; border-image: url(assets/ui/btn-s.png) 30 fill / 13px stretch;
    color: #f3ecff; padding: 0 2px; font-size: calc(14px * var(--fs)); }
  .seg button.on { border-image-source: url(assets/ui/btn-s-on.png); color: #fff; }
  .seg button:active { border-image-source: url(assets/ui/btn-s-hi.png); }
  .sq { width: 46px; height: 46px; border-width: 13px; border-image: url(assets/ui/btn-q.png) 30 fill / 13px stretch;
    padding: 0; font-size: calc(18px * var(--fs)); line-height: 1; color: #f3ecff; }
  .sq:active { border-image-source: url(assets/ui/btn-q-hi.png); }
  button.primary:active, button.wide:active { filter: brightness(1.12); }
  .stepper .sq[disabled] { opacity: .45; }
  @media (max-height: 520px) {
    .panel button.primary { margin-top: 4px; border-width: 13px; border-image-width: 13px; }
    .panel button.wide { margin-top: 4px; border-width: 12px; border-image-width: 12px; }
  }
  #hudBtns { position: fixed; top: 6px; right: 6px; display: none; gap: 6px; z-index: 5; }
  #hudBtns.show { display: flex; }
  #touch { position: fixed; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between; align-items: flex-end;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); z-index: 5; pointer-events: none; }
  #touch.show { display: flex; }
  #touch .grp { display: flex; gap: 8px; pointer-events: auto; }
  #touch button { width: 64px; height: 64px; padding: 0; font-size: 26px; line-height: 1; color: #f3ecff; background: none;
    border: solid transparent; border-width: 17px; border-image: url(assets/ui/btn-q.png) 30 fill / 17px stretch; }
  #touch button.held { border-image-source: url(assets/ui/btn-q-hi.png); }
  @media (max-height: 560px) { #touch button { width: 54px; height: 54px; font-size: 22px; border-width: 14px; border-image-width: 14px; } }
</style>
<script>try { var m = /[?&]font=(\w+)/.exec(location.search); if (m) document.documentElement.setAttribute('data-font', m[1]); } catch (e) {}</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="hudBtns">
  <button class="sq" id="btnReset" aria-label="restart">↺</button>
  <button class="sq" id="btnSound" aria-label="sound">♪</button>
  <button class="sq" id="btnPause" aria-label="pause">❚❚</button>
</div>

<div id="touch">
  <div class="grp">
    <button data-k="left">◀</button>
    <button data-k="down">▼</button>
    <button data-k="right">▶</button>
  </div>
  <div class="grp">
    <button data-k="ccw">⟲</button>
    <button data-k="cw">⟳</button>
  </div>
</div>

<div class="overlay" id="ovMenu">
  <div class="panel">
    <img class="art" src="assets/alchemist-stir.png" alt="">
    <h1 data-t="title"></h1>
    <p data-t="tagline"></p>
    <div class="row"><span data-t="level"></span>
      <div class="stepper"><button class="sq" id="lvDown">−</button><b id="lvVal">0</b><button class="sq" id="lvUp">+</button></div>
    </div>
    <div class="row col"><span data-t="speed"></span>
      <div class="seg" id="speedSeg">
        <button data-s="0" data-t="slow"></button><button data-s="1" data-t="medium"></button><button data-s="2" data-t="fast"></button>
      </div>
    </div>
    <p><span data-t="best"></span>: <b id="menuBest">0</b></p>
    <button class="primary" id="btnPlay" data-t="play"></button>
    <button class="wide" id="btnLeaders" data-t="leaders" style="display:none"></button>
    <p id="howto"></p>
  </div>
</div>

<div class="overlay" id="ovPause">
  <div class="panel">
    <h2 data-t="paused"></h2>
    <button class="primary" id="btnResume" data-t="resume"></button>
    <button class="wide" id="btnPauseMenu" data-t="menu"></button>
  </div>
</div>

<div class="overlay" id="ovReset">
  <div class="panel">
    <h2 data-t="resetTitle"></h2>
    <p data-t="resetText"></p>
    <button class="primary" id="btnResetYes" data-t="resetYes"></button>
    <button class="wide" id="btnResetNo" data-t="cancel"></button>
  </div>
</div>

<div class="overlay" id="ovWin">
  <div class="panel">
    <img class="art" src="assets/alchemist-cheer.png" alt="">
    <h2 data-t="win"></h2>
    <p data-t="score"></p><div class="big" id="winScore">0</div>
    <p class="rec" id="winRecord" data-t="newBest" style="display:none"></p>
    <button class="primary" id="btnNext" data-t="nextLevel"></button>
    <button class="wide" id="btnWinMenu" data-t="menu"></button>
  </div>
</div>

<div class="overlay" id="ovOver">
  <div class="panel">
    <img class="art" src="assets/alchemist-shock.png" alt="">
    <h2 data-t="over"></h2>
    <p data-t="score"></p><div class="big" id="overScore">0</div>
    <p class="rec" id="overRecord" data-t="newBest" style="display:none"></p>
    <button class="primary" id="btnRevive" data-t="revive"></button>
    <button class="wide" id="btnRetry" data-t="retry"></button>
    <button class="wide" id="btnOverMenu" data-t="menu"></button>
  </div>
</div>

<div class="overlay" id="ovLeaders">
  <div class="panel">
    <h2 data-t="leaders"></h2>
    <p><span data-t="lbMine"></span>: <b id="lbMine">0</b></p>
    <ol id="lbList"></ol>
    <p id="lbMsg"></p>
    <button class="wide" id="btnLbLogin" data-t="lbLogin" style="display:none"></button>
    <button class="primary" id="btnLbBack" data-t="back"></button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
